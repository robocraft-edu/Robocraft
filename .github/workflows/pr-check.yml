# Build check for pull requests into main. Auto-merge waits for this "build" check to pass.
name: PR build check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: BASE_PATH=/Robocraft/ npm run build
