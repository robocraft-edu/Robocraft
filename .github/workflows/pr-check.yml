# Build check for pull requests into main. Auto-merge waits for this "build" check to pass.
name: PR build check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
