# Publishes the web / iPhone version to GitHub Pages on every push.
# Live at: https://<user>.github.io/<repo>/
name: Deploy web app (iPhone & browsers)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run build
          cp dist/index.html dist/404.html   # deep links like /lesson/xyz work on refresh
      # Each build renames its code files. Someone who opened the app before this
      # update still asks for the old names, so keep earlier builds' files online
      # (last 5 days, at most 250 MB) and those screens keep loading instead of failing.
      - name: Restore files from earlier versions
        uses: actions/cache/restore@v4
        with:
          path: old-assets
          key: web-assets-${{ github.run_id }}
          restore-keys: web-assets-
      - name: Keep earlier versions' files next to the new ones
        run: |
          mkdir -p old-assets
          find old-assets -type f -mtime +5 -delete
          cp -n old-assets/* dist/assets/ 2>/dev/null || true
          cp -n dist/assets/* old-assets/
          # size cap: drop the oldest files first
          while [ "$(du -sm old-assets | cut -f1)" -gt 250 ]; do
            oldest=$(ls -tr old-assets | head -1); [ -z "$oldest" ] && break; rm -f "old-assets/$oldest"
          done
          echo "assets online: $(ls dist/assets | wc -l) files, $(du -sh dist/assets | cut -f1)"
      - name: Save files for the next update
        uses: actions/cache/save@v4
        with:
          path: old-assets
          key: web-assets-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
